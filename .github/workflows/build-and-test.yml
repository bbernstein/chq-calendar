name: Build and Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.19.0", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Build backend Lambda handlers (includes tests)
        run: npm run build --workspace=backend

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-node${{ matrix.node-version }}
          path: backend/coverage/

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.19.0", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Build frontend (includes type checking and linting)
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: ""

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-node${{ matrix.node-version }}
          path: frontend/out/

  # Note: Integration tests removed due to DynamoDB service container complexity
  # Post-deployment tests in deploy-production.yml verify the actual production system
