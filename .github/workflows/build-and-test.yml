name: Build and Test

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install all workspace dependencies
      run: npm ci
    
    - name: Run backend tests
      run: npm run test:ci --workspace=backend
    
    - name: Build backend Lambda handlers
      run: npm run build --workspace=backend
    
    - name: Upload backend coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage
        path: backend/coverage/

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install all workspace dependencies
      run: npm ci
    
    - name: Build frontend (includes type checking and linting)
      run: npm run build --workspace=frontend
      env:
        NEXT_PUBLIC_API_URL: https://www.chqcal.org/api
    
    - name: Upload frontend build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/.next/

  # Note: Integration tests removed due to DynamoDB service container complexity
  # Post-deployment tests in deploy-production.yml verify the actual production system