name: Build and Test

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == true
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "25"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Build publisher-format workspace (backend dep)
        run: npm run build --workspace=@chq-calendar/publisher-format

      - name: Build backend Lambda handlers (includes tests)
        run: npm run build --workspace=backend

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-node${{ matrix.node-version }}
          path: backend/coverage/

  test-frontend:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == true
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "25"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Build frontend (includes type checking and linting)
        run: npm run build --workspace=frontend
        env:
          # Mirror the deploy-production.yml frontend-build env so PR checks
          # reproduce the same vitest run conditions as the deploy build.
          # Without VITE_RECAPTCHA_SITE_KEY set here, the apply-page integration
          # tests pass on the PR check but fail post-merge during deploy
          # (vitest's `import.meta.env` reads VITE_* from process.env at
          # transform time; the apply page tries to load grecaptcha which
          # jsdom can't execute). vitest.config.ts has a `define` override
          # that forces the value to '' for tests — so this env var is
          # consumed only by `vite build`, but mirroring it here ensures any
          # future regression of that override surfaces pre-merge.
          VITE_API_URL: ""
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          VITE_ENABLE_PUBLISHER_FEEDS: "true"

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-node${{ matrix.node-version }}
          path: frontend/out/

  # Note: Integration tests removed due to DynamoDB service container complexity
  # Post-deployment tests in deploy-production.yml verify the actual production system
