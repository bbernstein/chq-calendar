name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Build backend
      run: |
        cd backend
        npm run build

    - name: Package Lambda function
      run: |
        cd backend
        npm run package:lambda

    - name: Update Lambda function
      run: |
        aws lambda update-function-code \
          --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
          --zip-file fileb://backend/lambda-function.zip

    - name: Update Lambda environment variables
      run: |
        aws lambda update-function-configuration \
          --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
          --environment 'Variables={
            "EVENTS_TABLE_NAME":"${{ secrets.EVENTS_TABLE_NAME }}",
            "DATA_SOURCES_TABLE_NAME":"${{ secrets.DATA_SOURCES_TABLE_NAME }}",
            "FEEDBACK_TABLE_NAME":"${{ secrets.FEEDBACK_TABLE_NAME }}",
            "ENVIRONMENT":"prod",
            "USE_NEW_API":"true",
            "RECAPTCHA_SECRET_KEY":"${{ secrets.RECAPTCHA_SECRET_KEY }}",
            "NEXTAUTH_URL":"https://chqcal.org",
            "NEXTAUTH_SECRET":"${{ secrets.NEXTAUTH_SECRET }}",
            "GOOGLE_CLIENT_ID":"${{ secrets.GOOGLE_CLIENT_ID }}",
            "GOOGLE_CLIENT_SECRET":"${{ secrets.GOOGLE_CLIENT_SECRET }}",
            "ADMIN_EMAIL_WHITELIST":"${{ secrets.ADMIN_EMAIL_WHITELIST }}"
          }'

  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      env:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
        NEXTAUTH_URL: https://chqcal.org
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        ADMIN_EMAIL_WHITELIST: ${{ secrets.ADMIN_EMAIL_WHITELIST }}
      run: |
        cd frontend
        npm run build


    - name: Deploy to S3
      run: |
        aws s3 sync frontend/out/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"

  initialize-database:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Initialize DynamoDB tables
      env:
        EVENTS_TABLE_NAME: ${{ secrets.EVENTS_TABLE_NAME }}
        DATA_SOURCES_TABLE_NAME: ${{ secrets.DATA_SOURCES_TABLE_NAME }}
        FEEDBACK_TABLE_NAME: ${{ secrets.FEEDBACK_TABLE_NAME }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        cd backend
        npm run init-tables