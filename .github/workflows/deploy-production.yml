name: Deploy to Production

on:
  push:
    branches: [main]
    # A merge touching ONLY these paths deploys nothing. Before this
    # existed, a docs-only or iOS-only merge redeployed six Lambdas, synced
    # S3, invalidated CloudFront and re-triggered three data ingests.
    #
    # paths-ignore is OR-semantics: a push touching both ios/** and
    # frontend/** still runs, which is what we want — the run is skipped
    # only when EVERY changed file matches.
    #
    # Deliberately NOT listed: shared/**, which is a frontend build input
    # (frontend/src/lib/quickLinks.ts imports @shared/links.json through the
    # Vite alias at vite.config.ts:132). Ignoring it would let a links.json
    # edit merge and silently never reach the header.
    #
    # Deliberately NOT listed either: docs/**. `**/*.md` already covers the
    # common case — a docs change is almost always all Markdown — and that
    # is where the saving is. Non-Markdown files under docs/ are NOT ignored
    # because some of them are Lambda BUILD INPUTS:
    # docs/publisher/categories.json and docs/publisher/venues.json are
    # copied into tools/publisher-format/dist/refs by its `copy-refs`
    # script, then into backend/dist/refs by backend's `build:prod`, and
    # shipped inside the admin and publisher-ingest zips. While docs/** was
    # ignored, editing a venue list merged with no workflow run at all.
    #
    # The narrower "ignore docs/ except docs/publisher/" cannot be written:
    # paths-ignore has no negation. An enumerated allow-list of "safe" docs
    # subdirectories is worse than nothing, because it silently re-breaks
    # the next time a subdirectory becomes a build input. With the area
    # split below, the cost of not ignoring docs/ is one cheap `changes`
    # job on a non-Markdown docs push, which then deploys nothing — unless
    # it touched docs/publisher/, which is in BACKEND_PATHS.
    paths-ignore:
      - 'ios/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment even if tests fail"
        type: boolean
        default: false

# Serialize deploys across every job in this workflow. Two concurrent runs
# would interleave the ci-e2e-test publisher's enable/disable toggles and
# corrupt the post-deploy retraction assertion. cancel-in-progress=false so
# an in-flight deploy completes (including its cleanup trap) before the next
# one starts.
#
# Workflow-level since the job split: a job-level group would serialize each
# job against itself but let a backend deploy from run N overlap a frontend
# deploy from run N+1.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Which areas this push actually touched, and whether the committer asked
  # to skip deploying. Computed once and consumed by both deploy jobs so the
  # decision lives in exactly one place.
  #
  # Uses plain git rather than a third-party paths-filter action: this needs
  # no new supply-chain dependency, and the logic is four lines.
  changes:
    runs-on: ubuntu-latest
    if: github.repository == 'bbernstein/chq-calendar'
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      skip: ${{ steps.detect.outputs.skip }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, NOT a shallow clone. At fetch-depth: 2 the
          # `github.event.before` commit is absent from the clone on any
          # multi-commit push, so `git diff "$BEFORE" HEAD` fails and the
          # script falls back to deploying everything. That direction is
          # safe, but it silently retires the no-deploy guarantee this
          # phase exists to provide — the guarantee IS the deliverable, so
          # the extra fetch time is the price of it.
          fetch-depth: 0

      - name: Detect changed areas and the skip-deploy marker
        id: detect
        env:
          # Read via env rather than interpolated into the script: a commit
          # message is attacker-controllable text and must never be spliced
          # into a shell command.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != 'push' ]; then
            # A manual run is an explicit "deploy now" — there is no
            # meaningful "what changed" for it, and gating it on the tip
            # commit's paths would make workflow_dispatch report green
            # having deployed nothing. This is the manual escape hatch.
            #
            # This branch must come FIRST. On workflow_dispatch `before` is
            # absent, so the `-z "$BEFORE"` branch below would catch it and
            # run `git diff HEAD^ HEAD` — which at fetch-depth: 0 always
            # succeeds, so FALLBACK_DEPLOY_ALL would never fire and a
            # dispatch on a docs-only tip commit would deploy nothing.
            CHANGED="FALLBACK_DEPLOY_ALL"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push to the branch, or a force-push — `before` is
            # unusable (all-zeros or empty). Fall back to the single
            # previous commit, and if even that is missing, deploy
            # everything rather than silently deploying nothing.
            CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "FALLBACK_DEPLOY_ALL")
          else
            CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "FALLBACK_DEPLOY_ALL")
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # FRONTEND_PATHS — anything that changes the built bundle.
          #
          # shared/ is in BOTH filters, deliberately. It is a hard frontend
          # build input: frontend/src/lib/quickLinks.ts imports
          # @shared/links.json through the Vite alias at vite.config.ts:132,
          # so a links.json edit must rebuild the frontend. It is in
          # BACKEND_PATHS as a conservative over-deploy: shared/ is the
          # repo's cross-cutting data directory, no backend source reads it
          # *today*, and the day one does, the filter already covers it.
          # Over-deploying costs a few minutes; under-deploying is the
          # silent-green failure this whole job exists to prevent.
          FRONTEND_PATHS='^(frontend/|shared/|package\.json|package-lock\.json)'
          # BACKEND_PATHS — anything that changes a Lambda bundle. Two
          # members here are NOT obvious and must not be "tidied" away:
          #
          #   tools/ — backend/package.json depends on
          #     @chq-calendar/publisher-format, which is the workspace at
          #     tools/publisher-format, and esbuild inlines it into
          #     adminHandler.js and publisherIngestHandler.js. A push
          #     touching only tools/publisher-format/src/** changes two
          #     Lambda bundles while looking like it touched no deployable
          #     code at all.
          #
          #   docs/publisher/ — categories.json and venues.json ship INSIDE
          #     the Lambda zips as dist/refs: tools/publisher-format's
          #     `copy-refs` copies them to its dist/refs, backend's
          #     `build:prod` copies that to backend/dist/refs, and the
          #     admin + publisher-ingest deploy steps `cp -r dist/refs` into
          #     the package. Editing a venue list is a Lambda change, however
          #     much its path says "docs". A docs/ path in a BACKEND filter
          #     looks like a mistake; it is not — delete it and venue edits
          #     stop reaching production.
          BACKEND_PATHS='^(backend/|tools/|docs/publisher/|shared/|package\.json|package-lock\.json)'

          if [ "$CHANGED" = "FALLBACK_DEPLOY_ALL" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            # Herestring, NOT `echo "$CHANGED" | grep -qE ...` — do not
            # "tidy" this back into a pipe. `grep -q` exits at the first
            # match, so on a large changed-file list the writer takes
            # SIGPIPE, `set -o pipefail` reports the pipeline as 141, and
            # the `|| ... =false` branch runs even though the pattern
            # MATCHED. Reproduced with a 5.5MB all-frontend file list: it
            # yields frontend=false, i.e. a silent no-deploy of a frontend
            # change — the exact failure this job exists to prevent. A
            # herestring feeds grep from a temp file, so there is no pipe
            # and nothing to SIGPIPE.
            grep -qE "$FRONTEND_PATHS" <<< "$CHANGED" \
              && echo "frontend=true" >> "$GITHUB_OUTPUT" \
              || echo "frontend=false" >> "$GITHUB_OUTPUT"
            grep -qE "$BACKEND_PATHS" <<< "$CHANGED" \
              && echo "backend=true" >> "$GITHUB_OUTPUT" \
              || echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          # The manual brake. A NON-EMPTY reason is required, so opting out
          # is a recorded decision rather than silence — the same contract
          # as [skip-screenshots: <reason>] in app-store-assets.yml. A bare
          # [skip-deploy] deliberately does NOT match and does NOT skip.
          #
          # The leading [^][:space:]] is load-bearing: it forces the first
          # character of the reason to be non-whitespace. The obvious
          # `[^]]+` instead matches `[skip-deploy: ]`, because ` *` simply
          # backtracks to zero and lets `[^]]+` consume the space itself —
          # so a whitespace-only "reason" would silently skip the deploy.
          #
          # Herestring rather than `printf ... | grep`, for the same
          # SIGPIPE-under-pipefail reason as the path checks above. A
          # commit message is small enough that the pipe form would almost
          # always work, which is precisely what makes it a bad thing to
          # leave in place.
          if grep -qE '\[skip-deploy: *[^][:space:]][^]]*\]' <<< "$COMMIT_MESSAGE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::[skip-deploy:] marker found in the commit message"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "backend=${{ steps.detect.outputs.backend }}"
          echo "frontend=${{ steps.detect.outputs.frontend }}"
          echo "skip=${{ steps.detect.outputs.skip }}"

  # Lambda bundles, the publisher E2E suite and the post-deploy data-sync
  # triggers. Runs only when a backend build input moved.
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production
    needs: changes
    # Guards against forks: this job deploys straight to chqcal.org on push
    # to main with static AWS keys and no branch-protection gate. A fork
    # would otherwise red-X on every push (no secrets configured) or, worse,
    # actually deploy over production if someone ever added real creds to
    # the fork's secrets.
    if: >-
      github.repository == 'bbernstein/chq-calendar'
      && needs.changes.outputs.skip != 'true'
      && needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Record deploy start time
        id: deploy_start
        # Captured before any Lambda deploys so the publisher E2E test can
        # assert each function's LastModified is newer than this deploy. Used as
        # the workflow_dispatch fallback for DEPLOY_START_RAW: github.run_started_at
        # is not a real github-context field and resolves to '' on manual runs,
        # which made the downstream datetime.fromisoformat('') throw.
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:prod --workspace=backend

      - name: Deploy calendar Lambda function
        working-directory: ./backend
        run: |
          # Clean any previous build artifacts
          rm -rf lambda-function.zip

          # Build the Lambda functions
          npm run build:prod

          # Install only the required production dependencies (external from esbuild)
          npm ci --omit=dev

          # Create a minimal package with only required dependencies
          mkdir -p package_temp/node_modules

          # Check where node_modules is located
          echo "Checking node_modules location..."
          if [ -d "node_modules" ]; then
            NODE_MODULES_PATH="node_modules"
            echo "Found node_modules in current directory"
          elif [ -d "../node_modules" ]; then
            NODE_MODULES_PATH="../node_modules"
            echo "Found node_modules in parent directory"
          else
            echo "Error: node_modules not found!"
            ls -la
            exit 1
          fi

          # Use npm to install only externalized dependencies with their transitive deps
          echo "Installing externalized dependencies with all transitive dependencies..."
          cd package_temp

          # Create a minimal package.json with only externalized dependencies (using same versions as main package.json)
          cat > package.json << 'EOF'
          {
            "name": "lambda-calendar",
            "version": "1.0.0",
            "dependencies": {
              "@aws-sdk/client-dynamodb": "^3.0.0",
              "@aws-sdk/client-s3": "^3.0.0",
              "@aws-sdk/lib-dynamodb": "^3.0.0",
              "ical-generator": "^4.1.0",
              "date-fns": "^2.29.3",
              "cheerio": "^1.0.0-rc.12",
              "axios": "^1.6.0",
              "uuid": "^9.0.0",
              "node-fetch": "^2.7.0"
            }
          }
          EOF

          # Install all dependencies (this will get all transitive deps)
          npm install --omit=dev --no-package-lock

          cd ..

          # Copy the original package.json back
          cp package.json package_temp/package.json

          # List what we installed for debugging
          echo "Installed dependencies:"
          ls package_temp/node_modules/ | head -20

          # Create package for calendar handler (package.json already copied above)
          mkdir -p package_temp/dist
          cp dist/calendarHandler.js package_temp/dist/

          cd package_temp
          zip -r ../lambda-calendar.zip . -x "*.md" "*/test/*" "*/tests/*" "*/examples/*" "README.md" "CHANGELOG.md"
          cd ..

          # Deploy calendar Lambda
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda-calendar.zip

          # Wait for the code update to complete
          echo "Waiting for calendar Lambda function to finish updating..."
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

          # Environment variables are managed by Terraform — do not set them here
          # to avoid drift between CI and infrastructure-as-code.

          # Clean up
          rm -rf package_temp lambda-calendar.zip

      - name: Deploy admin Lambda function
        working-directory: ./backend
        run: |
          # Create a minimal package for admin handler with required dependencies
          mkdir -p package_temp/node_modules

          # Install admin handler dependencies with all transitive deps
          echo "Installing admin handler dependencies with all transitive dependencies..."
          cd package_temp

          # Create a minimal package.json listing only what esbuild leaves as runtime requires.
          #
          # Versions for AWS SDK / googleapis / jsonwebtoken / node-fetch / uuid come from
          # backend/package.json. cheerio is pulled in transitively via
          # @chq-calendar/publisher-format (used by the publisher-portal handler that
          # adminHandler delegates to); the version pin matches both backend/package.json
          # and tools/publisher-format/package.json.
          #
          # Why cheerio specifically: esbuild's adminHandler build marks cheerio as
          # `--external`, so the bundle contains a real `require("cheerio")` that must
          # resolve at runtime. The publisher-format library also uses ajv/ajv-formats,
          # but those are fully bundled inline by esbuild — the `require("ajv/dist/...")`
          # strings visible in the bundle are codegen template literals (set as
          # `equal.code`, used only for ajv's standalone-mode source generation), not
          # runtime require() calls. Verified by loading the bundle with only the
          # dependencies listed below and confirming module evaluation succeeds.
          cat > package.json << 'EOF'
          {
            "name": "lambda-admin",
            "version": "1.0.0",
            "dependencies": {
              "@aws-sdk/client-dynamodb": "^3.0.0",
              "@aws-sdk/lib-dynamodb": "^3.0.0",
              "@aws-sdk/client-secrets-manager": "^3.0.0",
              "@aws-sdk/client-sesv2": "^3.0.0",
              "cheerio": "^1.0.0-rc.12",
              "googleapis": "^153.0.0",
              "jsonwebtoken": "^9.0.2",
              "node-fetch": "^2.7.0",
              "uuid": "^9.0.0"
            }
          }
          EOF

          # Install all dependencies (this will get all transitive deps)
          npm install --omit=dev --no-package-lock

          cd ..

          # Copy the original package.json back
          cp package.json package_temp/package.json

          # List what we installed for debugging — matches the calendar deploy step
          echo "Installed admin dependencies:"
          ls package_temp/node_modules/ | head -30

          # Create package for admin handler (package.json already copied above)
          mkdir -p package_temp/dist
          cp dist/adminHandler.js package_temp/dist/
          # Refs (categories, venues) are loaded by @chq-calendar/publisher-format's
          # loadReferences() at /publisher-test invocation time. The library reads
          # from `dist/refs/` relative to its own __dirname; without these files
          # it falls through to a repo path that does not exist inside the Lambda
          # filesystem, and /publisher-test (delegated from adminHandler) returns
          # 500 with ENOENT. publisher-ingest already includes this copy.
          cp -r dist/refs package_temp/dist/refs

          cd package_temp
          zip -r ../lambda-admin.zip . -x "*.md" "*/test/*" "*/tests/*" "*/examples/*" "README.md" "CHANGELOG.md"
          cd ..

          # Deploy admin Lambda (assuming the admin function name is stored in secrets)
          aws lambda update-function-code \
            --function-name ${{ secrets.ADMIN_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda-admin.zip

          # Wait for the code update to complete
          echo "Waiting for admin Lambda function to finish updating..."
          aws lambda wait function-updated \
            --function-name ${{ secrets.ADMIN_LAMBDA_FUNCTION_NAME }}

          # Environment variables are managed by Terraform — do not set them here
          # to avoid drift between CI and infrastructure-as-code.

          # Clean up
          rm -rf package_temp lambda-admin.zip

      - name: Deploy sync Lambda functions
        working-directory: ./backend
        run: |
          # Create a minimal package for sync handler with required dependencies
          mkdir -p package_temp/node_modules

          echo "Installing sync handler dependencies..."
          cd package_temp

          # Sync handler externalizes only AWS SDK modules (everything else is bundled by esbuild)
          # Use the repo's lock file to ensure reproducible installs
          cat > package.json << 'EOF'
          {
            "name": "lambda-sync",
            "version": "1.0.0",
            "dependencies": {
              "@aws-sdk/client-dynamodb": "^3.0.0",
              "@aws-sdk/client-s3": "^3.0.0",
              "@aws-sdk/lib-dynamodb": "^3.0.0"
            }
          }
          EOF

          npm install --omit=dev
          cd ..

          # Create package for sync handler
          mkdir -p package_temp/dist
          cp dist/syncHandler.js package_temp/dist/

          cd package_temp
          zip -r ../lambda-sync.zip . -x "*.md" "*/test/*" "*/tests/*" "*/examples/*" "README.md" "CHANGELOG.md"
          cd ..

          # All sync functions share the same syncHandler.js (different exported handlers)
          SYNC_FUNCTIONS=(
            "chq-calendar-data-sync"
            "chq-calendar-manual-sync"
            "chq-calendar-sync-health"
            "chq-calendar-sync-status"
            "chq-calendar-sync-list"
          )

          for FUNC_NAME in "${SYNC_FUNCTIONS[@]}"; do
            echo "Deploying sync code to ${FUNC_NAME}..."
            aws lambda update-function-code \
              --function-name "${FUNC_NAME}" \
              --zip-file fileb://lambda-sync.zip

            echo "Waiting for ${FUNC_NAME} to finish updating..."
            aws lambda wait function-updated \
              --function-name "${FUNC_NAME}"
          done

          # Clean up
          rm -rf package_temp lambda-sync.zip

      - name: Deploy publisher-ingest Lambda
        working-directory: ./backend
        run: |
          # Publisher-ingest handler externalizes only AWS SDK modules (everything
          # else is bundled by esbuild). It also needs dist/refs/ at runtime for
          # loadReferences() (venue enrichment in the sidecar publisher).
          mkdir -p package_temp/node_modules

          echo "Installing publisher-ingest handler dependencies..."
          cd package_temp
          cat > package.json << 'EOF'
          {
            "name": "lambda-publisher-ingest",
            "version": "1.0.0",
            "dependencies": {
              "@aws-sdk/client-dynamodb": "^3.0.0",
              "@aws-sdk/client-s3": "^3.0.0",
              "@aws-sdk/lib-dynamodb": "^3.0.0"
            }
          }
          EOF
          npm install --omit=dev
          cd ..

          mkdir -p package_temp/dist
          cp dist/publisherIngestHandler.js package_temp/dist/
          # Refs (venues, categories, locations) are loaded via loadReferences()
          # at handler init from dist/refs/. Without them, venue enrichment is
          # silently disabled — handler still runs.
          cp -r dist/refs package_temp/dist/refs

          cd package_temp
          zip -r ../lambda-publisher-ingest.zip . \
            -x "*.md" "*/test/*" "*/tests/*" "*/examples/*" "README.md" "CHANGELOG.md"
          cd ..

          echo "Deploying publisher-ingest Lambda..."
          aws lambda update-function-code \
            --function-name chautauqua-calendar-publisher-ingest \
            --zip-file fileb://lambda-publisher-ingest.zip

          echo "Waiting for publisher-ingest Lambda to finish updating..."
          aws lambda wait function-updated \
            --function-name chautauqua-calendar-publisher-ingest

          rm -rf package_temp lambda-publisher-ingest.zip

      - name: Deploy article-ingest Lambda
        working-directory: ./backend
        run: |
          # The article-ingest Lambda is created by `terraform apply`
          # (infrastructure/article-ingest.tf). On the very first deploy —
          # before that apply — the function does not exist yet, so guard the
          # code update and skip cleanly instead of failing the whole deploy.
          FUNC="chautauqua-calendar-article-ingest"
          # Skip cleanly only for a genuine "not created yet" (before the first
          # terraform apply). Any other error — AccessDenied, throttling — fails
          # loud instead of masquerading as "waiting on terraform apply".
          if aws lambda get-function --function-name "$FUNC" >/dev/null 2>/tmp/gf-article-deploy.err; then
            :
          elif grep -q 'ResourceNotFoundException\|Function not found' /tmp/gf-article-deploy.err; then
            echo "::notice::${FUNC} not created yet — run 'terraform apply' to create it; skipping code deploy this run"
            exit 0
          else
            echo "::error::checking ${FUNC} failed (not a not-found error — likely IAM/API):"
            cat /tmp/gf-article-deploy.err
            exit 1
          fi

          # article-ingest externalizes only the AWS SDK modules; cheerio and
          # everything else are bundled inline by esbuild (the deploy zip carries
          # no node_modules). It needs no dist/refs (it doesn't use
          # publisher-format's loadReferences).
          mkdir -p package_temp/node_modules

          echo "Installing article-ingest handler dependencies..."
          cd package_temp
          cat > package.json << 'EOF'
          {
            "name": "lambda-article-ingest",
            "version": "1.0.0",
            "dependencies": {
              "@aws-sdk/client-dynamodb": "^3.0.0",
              "@aws-sdk/client-s3": "^3.0.0",
              "@aws-sdk/lib-dynamodb": "^3.0.0"
            }
          }
          EOF
          npm install --omit=dev
          cd ..

          mkdir -p package_temp/dist
          cp dist/articleIngestHandler.js package_temp/dist/

          cd package_temp
          zip -r ../lambda-article-ingest.zip . \
            -x "*.md" "*/test/*" "*/tests/*" "*/examples/*" "README.md" "CHANGELOG.md"
          cd ..

          echo "Deploying article-ingest Lambda..."
          aws lambda update-function-code \
            --function-name "$FUNC" \
            --zip-file fileb://lambda-article-ingest.zip

          echo "Waiting for article-ingest Lambda to finish updating..."
          aws lambda wait function-updated \
            --function-name "$FUNC"

          rm -rf package_temp lambda-article-ingest.zip

      - name: Deploy program-ingest Lambda
        working-directory: ./backend
        run: |
          # The program-ingest Lambda is created by `terraform apply`
          # (infrastructure/program-ingest.tf). On the very first deploy —
          # before that apply — the function does not exist yet, so guard the
          # code update and skip cleanly instead of failing the whole deploy.
          FUNC="chautauqua-calendar-program-ingest"
          if aws lambda get-function --function-name "$FUNC" >/dev/null 2>/tmp/gf-program-deploy.err; then
            :
          elif grep -q 'ResourceNotFoundException\|Function not found' /tmp/gf-program-deploy.err; then
            echo "::notice::${FUNC} not created yet — run 'terraform apply' to create it; skipping code deploy this run"
            exit 0
          else
            echo "::error::checking ${FUNC} failed (not a not-found error — likely IAM/API):"
            cat /tmp/gf-program-deploy.err
            exit 1
          fi

          # program-ingest externalizes only @aws-sdk/client-s3; cheerio and
          # everything else are bundled inline by esbuild.
          mkdir -p package_temp/node_modules

          echo "Installing program-ingest handler dependencies..."
          cd package_temp
          cat > package.json << 'EOF'
          {
            "name": "lambda-program-ingest",
            "version": "1.0.0",
            "dependencies": {
              "@aws-sdk/client-s3": "^3.0.0"
            }
          }
          EOF
          npm install --omit=dev
          cd ..

          mkdir -p package_temp/dist
          cp dist/programIngestHandler.js package_temp/dist/

          cd package_temp
          zip -r ../lambda-program-ingest.zip . \
            -x "*.md" "*/test/*" "*/tests/*" "*/examples/*" "README.md" "CHANGELOG.md"
          cd ..

          echo "Deploying program-ingest Lambda..."
          aws lambda update-function-code \
            --function-name "$FUNC" \
            --zip-file fileb://lambda-program-ingest.zip

          echo "Waiting for program-ingest Lambda to finish updating..."
          aws lambda wait function-updated \
            --function-name "$FUNC"

          rm -rf package_temp lambda-program-ingest.zip

      - name: Update Lambda function URL (if using Function URL)
        run: |
          # Update API Gateway or Lambda Function URL if needed
          echo "Backend deployed to Lambda function: ${{ secrets.LAMBDA_FUNCTION_NAME }}"
          # This step runs in deploy-backend and must claim ONLY what
          # deploy-backend did. It used to also print "Frontend deployed to:
          # https://www.chqcal.org", which was harmless in the monolithic
          # job but is false log evidence now: on a backend-only run
          # deploy-frontend is skipped and nothing was published to the
          # site.

      - name: Publisher disable→retract end-to-end test
        # Validates the full publisher-ingest pipeline against real DynamoDB +
        # real S3 sidecar. Catches regressions that unit tests miss: Lambda
        # version mismatch, IAM drift, sidecar publisher errors. Reads the
        # sidecar directly from S3 (not via CloudFront) — the default cache
        # behavior has `query_string = false` and the sidecar object has
        # `max-age=300`, so any URL-based poll would see stale content for
        # up to 5 minutes regardless of cache-buster query strings.
        # Requires `var.enable_ci_e2e_publisher = true` so the
        # ci-e2e-test publisher row + static feed exist.
        shell: bash
        env:
          # head_commit.timestamp is set only on push; on workflow_dispatch fall
          # back to the "Record deploy start time" step (see its comment for why).
          DEPLOY_START_RAW: ${{ github.event.head_commit.timestamp || steps.deploy_start.outputs.ts }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail

          PUBLISHER_ID="ci-e2e-test"
          PUBLISHERS_TABLE="chautauqua-calendar-publishers"
          LAMBDA="chautauqua-calendar-publisher-ingest"
          # Local feed file in the checkout — this is the same file Terraform
          # uploads to S3, so deriving the year locally avoids any cache /
          # propagation race with the freshly-deployed S3 object.
          LOCAL_FEED_PATH="$GITHUB_WORKSPACE/infrastructure/ci-e2e-feed.json"

          # Sidecar key is publisher-events-${year}.json where ${year} comes
          # from each event's startDate (see publisherSidecarPublisher.ts).
          # Derive from the local checkout — do NOT hardcode the year, or the
          # S3 key drifts off the actual sidecar object as the season rolls
          # over.
          SIDECAR_YEAR=$(jq -r '.events[0].startDate[0:4]' "$LOCAL_FEED_PATH")
          if ! [[ "$SIDECAR_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "::error::SIDECAR_YEAR '${SIDECAR_YEAR}' from $LOCAL_FEED_PATH is not a 4-digit year"
            exit 1
          fi
          SIDECAR_S3_KEY="cache/calendar-cache/publisher-events-${SIDECAR_YEAR}.json"
          echo "[ci-e2e] sidecar year=${SIDECAR_YEAR}, s3 key=${SIDECAR_S3_KEY}"

          # Verify the Lambda invocation didn't produce a handler error.
          # `aws lambda invoke --invocation-type RequestResponse` returns
          # exit 0 even when the handler throws — the error is signalled
          # two places, NEITHER of which is the literal substring
          # "FunctionError" inside the response payload file:
          #   1. The CLI's STDOUT metadata JSON contains a `FunctionError`
          #      key (e.g. "Unhandled") — captured separately at the call
          #      site and passed in as $3.
          #   2. The response PAYLOAD file (--out destination) contains
          #      Lambda's unhandled-error shape: `{ "errorType": ...,
          #      "errorMessage": ..., "trace": [...] }`.
          # Check both so we catch handler throws regardless of which
          # surface AWS uses to report them.
          assert_no_function_error() {
            local file="$1" label="$2" meta="${3:-}"
            if [ -n "$meta" ] && echo "$meta" | jq -e '.FunctionError' >/dev/null 2>&1; then
              echo "::error::${label}: Lambda returned a FunctionError ($(echo "$meta" | jq -r '.FunctionError'))"
              echo "[ci-e2e] response payload:"
              cat "$file"
              return 1
            fi
            if jq -e '.errorType // .errorMessage' "$file" >/dev/null 2>&1; then
              echo "::error::${label}: Lambda response payload contains errorType/errorMessage"
              cat "$file"
              return 1
            fi
          }

          # Count test-publisher events in the sidecar by reading the S3
          # object directly. Bypasses CloudFront entirely — see step
          # description for why URL-based polling can't work here. Returns:
          #   0  if the sidecar object is missing (zero events from any
          #      publisher) or present but with no events from $PUBLISHER_ID
          #   N  on a present sidecar with N events from $PUBLISHER_ID
          #   "" on transient AWS / jq failure — caller uses its own fallback
          #      (events-appear poll: treat as 0; events-retract poll: 1)
          count_test_events_in_sidecar() {
            # Note: don't combine `local body=$(...)` with $? checks — `local`
            # masks the rc. Run the AWS call as its own statement.
            if aws s3api get-object \
                --bucket "$S3_BUCKET" --key "$SIDECAR_S3_KEY" \
                /tmp/ci-e2e-sidecar.json >/dev/null 2>/tmp/ci-e2e-s3.err; then
              jq "[.data[]? | select(.sourcePublisherId==\"$PUBLISHER_ID\")] | length" \
                /tmp/ci-e2e-sidecar.json 2>/dev/null \
                || echo ""
              return
            fi
            if grep -q 'NoSuchKey\|Not Found\|404' /tmp/ci-e2e-s3.err; then
              # Sidecar object absent ≡ no events from any publisher
              # in this year — definitionally zero from $PUBLISHER_ID.
              echo 0
              return
            fi
            echo "[ci-e2e] s3 get-object failed (transient):" >&2
            cat /tmp/ci-e2e-s3.err >&2
            echo ""
          }

          cleanup() {
            # Cleanup must never propagate a failure: surfacing a cleanup
            # error on top of an already-failed test loses the original
            # signal. Disable -e for the body and || true each AWS call.
            set +e
            echo "[ci-e2e] cleanup: disabling $PUBLISHER_ID and purging events"
            aws dynamodb update-item --table-name "$PUBLISHERS_TABLE" \
              --key "{\"id\":{\"S\":\"$PUBLISHER_ID\"}}" \
              --update-expression 'SET enabled = :f' \
              --expression-attribute-values '{":f":{"BOOL":false}}' || true
            # Final ingest to retract anything left. Fire-and-forget
            # (--invocation-type Event) so a slow Lambda doesn't hold the
            # CI runner — we already swallow errors here, so synchronous
            # waiting buys us nothing.
            aws lambda invoke --function-name "$LAMBDA" \
              --invocation-type Event \
              --cli-binary-format raw-in-base64-out --payload '{}' \
              /tmp/ci-e2e-cleanup.json || true
          }
          trap cleanup EXIT

          # 0. Verify the Lambda was actually updated by this deploy. Catches
          #    the PR #78 trap where the disable→retract code was merged but
          #    the Lambda zip never shipped.
          LAST_MODIFIED=$(aws lambda get-function --function-name "$LAMBDA" \
            --query 'Configuration.LastModified' --output text)
          # Pass values via env (not shell substitution into the heredoc) to
          # avoid injection from any unexpected characters and to keep the
          # Python source quoted-as-written. AWS LastModified comes back like
          # `2026-05-03T14:55:12.000+0000` — the `+0000` form is not parseable
          # by datetime.fromisoformat on Python <3.11, so normalize.
          LAST_MODIFIED="$LAST_MODIFIED" \
          DEPLOY_START_RAW="$DEPLOY_START_RAW" \
          python3 - <<'PY'
          import os, re, sys
          from datetime import datetime

          def parse(ts: str) -> datetime:
              # fromisoformat accepts +00:00 and (3.11+) Z; normalize +0000 → +00:00
              t = ts.replace('Z', '+00:00')
              t = re.sub(r'([+-]\d{2})(\d{2})$', r'\1:\2', t)
              return datetime.fromisoformat(t)

          lm = parse(os.environ['LAST_MODIFIED'])
          ds = parse(os.environ['DEPLOY_START_RAW'])
          if lm < ds:
              print(f"::error::Lambda LastModified {lm.isoformat()} predates deploy start {ds.isoformat()} — code did not ship")
              sys.exit(1)
          print(f"[ci-e2e] Lambda LastModified {lm.isoformat()} >= deploy start {ds.isoformat()}")
          PY

          # 1. Pre-test cleanliness assertion: if a previous run failed
          #    after ingest #1 but before cleanup, leftover ci-e2e-test
          #    events would still be in the sidecar. Without this check
          #    the "events appeared" poll would short-circuit on iteration
          #    1 and mask a broken pipeline. The cleanup trap from the
          #    previous run *should* have purged them, but cleanup itself
          #    is best-effort — verify before we trust it.
          INITIAL_RAW=$(count_test_events_in_sidecar)
          INITIAL_COUNT=${INITIAL_RAW:-0}
          if [ "$INITIAL_COUNT" -gt 0 ]; then
            echo "::error::Sidecar already has ${INITIAL_COUNT} stale ${PUBLISHER_ID} event(s) before test start; manual cleanup required"
            exit 1
          fi

          # 2. Enable the test publisher. `attribute_exists(id)` makes this
          #    a strict update — if the row was never provisioned (e.g.
          #    var.enable_ci_e2e_publisher = false), DynamoDB throws
          #    ConditionalCheckFailedException instead of silently
          #    upserting a partial {id, enabled} row that the next hourly
          #    ingest would choke on.
          #
          #    enabledAt is set alongside enabled so the publisher-ingest
          #    Lambda's auto-disable safety net can distinguish "row was
          #    just enabled by an active CI run" from "row enabled but
          #    abandoned for >1h" (autoDisableStaleCiE2e). Without this
          #    timestamp the safety net would trip on every CI run that
          #    follows >1h after the previous one.
          NOW_ISO=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          aws dynamodb update-item --table-name "$PUBLISHERS_TABLE" \
            --key "{\"id\":{\"S\":\"$PUBLISHER_ID\"}}" \
            --condition-expression 'attribute_exists(id)' \
            --update-expression 'SET enabled = :t, enabledAt = :now' \
            --expression-attribute-values "{\":t\":{\"BOOL\":true},\":now\":{\"S\":\"$NOW_ISO\"}}"

          # 3. Trigger ingest synchronously. Capture STDOUT metadata
          #    (StatusCode, FunctionError, ExecutedVersion) separately
          #    from the response payload file so assert_no_function_error
          #    can inspect both.
          INGEST1_META=$(aws lambda invoke --function-name "$LAMBDA" \
            --invocation-type RequestResponse \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            /tmp/ci-e2e-ingest1.json)
          echo "[ci-e2e] ingest #1 metadata: $INGEST1_META"
          echo "[ci-e2e] ingest #1 response:"
          cat /tmp/ci-e2e-ingest1.json
          echo
          assert_no_function_error /tmp/ci-e2e-ingest1.json "ingest #1" "$INGEST1_META"

          # 4. Poll sidecar (read directly from S3 in count_test_events_in_sidecar)
          #    for the test events to appear.
          COUNT=0  # fail-open so a transient AWS error in the loop doesn't
                   # immediately mark the test as passing for "events appeared"
                   # (we only break on COUNT>=1).
          for i in $(seq 1 30); do
            RAW=$(count_test_events_in_sidecar)
            COUNT=${RAW:-0}  # transient → 0, keep polling
            if [ "$COUNT" -ge 1 ]; then
              echo "[ci-e2e] events present after ${i}s (count=$COUNT)"
              break
            fi
            sleep 1
          done
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Test events did not appear in sidecar within 30s"
            exit 1
          fi

          # 5. Disable the publisher (same condition guard as step 2).
          aws dynamodb update-item --table-name "$PUBLISHERS_TABLE" \
            --key "{\"id\":{\"S\":\"$PUBLISHER_ID\"}}" \
            --condition-expression 'attribute_exists(id)' \
            --update-expression 'SET enabled = :f' \
            --expression-attribute-values '{":f":{"BOOL":false}}'

          # 6. Trigger ingest again — same metadata-capture pattern as
          #    step 3 so assert_no_function_error sees the FunctionError
          #    key (if any) on the CLI's STDOUT JSON.
          INGEST2_META=$(aws lambda invoke --function-name "$LAMBDA" \
            --invocation-type RequestResponse \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            /tmp/ci-e2e-ingest2.json)
          echo "[ci-e2e] ingest #2 metadata: $INGEST2_META"
          echo "[ci-e2e] ingest #2 response:"
          cat /tmp/ci-e2e-ingest2.json
          echo
          assert_no_function_error /tmp/ci-e2e-ingest2.json "ingest #2" "$INGEST2_META"

          # 7. Poll sidecar for the test events to disappear.
          COUNT=1  # fail-closed so a transient curl error doesn't immediately
                   # mark the retraction as successful.
          for i in $(seq 1 30); do
            RAW=$(count_test_events_in_sidecar)
            COUNT=${RAW:-1}  # transient → 1, keep polling
            if [ "$COUNT" -eq 0 ]; then
              echo "[ci-e2e] events retracted after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$COUNT" -ne 0 ]; then
            echo "::error::Test events were not retracted within 30s (count=$COUNT)"
            exit 1
          fi

          echo "✅ Publisher disable→retract end-to-end test passed"

      - name: Publisher single-publisher mode E2E test
        # Validates the singlePublisherId code path that backs the
        # `/publisher-fetch-now` self-service endpoint (Phase 5 of the
        # publisher self-service plan). Phase 5's unit tests cover the
        # Lambda payload contract; this step catches deployment-time
        # regressions (IAM, payload parsing in the deployed handler,
        # sidecar refresh logic on a single-publisher run).
        #
        # Sequencing: runs AFTER the disable→retract step, which leaves
        # the ci-e2e-test publisher disabled with no sidecar events.
        # We re-enable, run a singlePublisherId ingest, assert events
        # appear, then disable + cleanup.
        #
        # Requires `var.enable_ci_e2e_publisher = true` so the
        # ci-e2e-test publisher row + static feed exist (same row used
        # by the previous step).
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail

          PUBLISHER_ID="ci-e2e-test"
          PUBLISHERS_TABLE="chautauqua-calendar-publishers"
          LAMBDA="chautauqua-calendar-publisher-ingest"
          LOCAL_FEED_PATH="$GITHUB_WORKSPACE/infrastructure/ci-e2e-feed.json"

          # Sidecar key derived the same way as the previous step — see
          # that step for the reasoning behind reading from the local
          # checkout rather than the deployed S3 object.
          SIDECAR_YEAR=$(jq -r '.events[0].startDate[0:4]' "$LOCAL_FEED_PATH")
          if ! [[ "$SIDECAR_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "::error::SIDECAR_YEAR '${SIDECAR_YEAR}' from $LOCAL_FEED_PATH is not a 4-digit year"
            exit 1
          fi
          SIDECAR_S3_KEY="cache/calendar-cache/publisher-events-${SIDECAR_YEAR}.json"
          # Expected count from the local feed — assert that the
          # single-publisher run ingested ALL feed events, not just one.
          EXPECTED_COUNT=$(jq '.events | length' "$LOCAL_FEED_PATH")
          echo "[ci-e2e single] sidecar year=${SIDECAR_YEAR}, s3 key=${SIDECAR_S3_KEY}, expected count=${EXPECTED_COUNT}"

          # See the disable→retract step above for the rationale: grepping
          # the response payload for the literal "FunctionError" string is
          # incorrect — that key lives in the CLI's STDOUT metadata, not
          # the payload file. We check both surfaces (metadata JSON passed
          # in as $3, plus the payload's `errorType`/`errorMessage` shape).
          assert_no_function_error() {
            local file="$1" label="$2" meta="${3:-}"
            if [ -n "$meta" ] && echo "$meta" | jq -e '.FunctionError' >/dev/null 2>&1; then
              echo "::error::${label}: Lambda returned a FunctionError ($(echo "$meta" | jq -r '.FunctionError'))"
              echo "[ci-e2e single] response payload:"
              cat "$file"
              return 1
            fi
            if jq -e '.errorType // .errorMessage' "$file" >/dev/null 2>&1; then
              echo "::error::${label}: Lambda response payload contains errorType/errorMessage"
              cat "$file"
              return 1
            fi
          }

          count_test_events_in_sidecar() {
            if aws s3api get-object \
                --bucket "$S3_BUCKET" --key "$SIDECAR_S3_KEY" \
                /tmp/ci-e2e-single-sidecar.json >/dev/null 2>/tmp/ci-e2e-single-s3.err; then
              jq "[.data[]? | select(.sourcePublisherId==\"$PUBLISHER_ID\")] | length" \
                /tmp/ci-e2e-single-sidecar.json 2>/dev/null \
                || echo ""
              return
            fi
            if grep -q 'NoSuchKey\|Not Found\|404' /tmp/ci-e2e-single-s3.err; then
              echo 0
              return
            fi
            echo "[ci-e2e single] s3 get-object failed (transient):" >&2
            cat /tmp/ci-e2e-single-s3.err >&2
            echo ""
          }

          cleanup() {
            # Always-runs cleanup. Mirrors the previous step's pattern:
            # disable the publisher, then fire-and-forget a full ingest
            # to retract any leftover events. Errors are swallowed so a
            # cleanup failure can't mask the real test failure.
            set +e
            echo "[ci-e2e single] cleanup: disabling $PUBLISHER_ID and purging events"
            aws dynamodb update-item --table-name "$PUBLISHERS_TABLE" \
              --key "{\"id\":{\"S\":\"$PUBLISHER_ID\"}}" \
              --update-expression 'SET enabled = :f' \
              --expression-attribute-values '{":f":{"BOOL":false}}' || true
            aws lambda invoke --function-name "$LAMBDA" \
              --invocation-type Event \
              --cli-binary-format raw-in-base64-out --payload '{}' \
              /tmp/ci-e2e-single-cleanup.json || true
          }
          trap cleanup EXIT

          # 1. Pre-test cleanliness: the previous step's cleanup should
          #    have left zero ci-e2e-test events in the sidecar.
          INITIAL_RAW=$(count_test_events_in_sidecar)
          INITIAL_COUNT=${INITIAL_RAW:-0}
          if [ "$INITIAL_COUNT" -gt 0 ]; then
            echo "::error::Sidecar already has ${INITIAL_COUNT} stale ${PUBLISHER_ID} event(s) before single-publisher test start"
            exit 1
          fi

          # 2. Re-enable the test publisher (strict update — fails if
          #    the row is missing rather than upserting a partial row).
          #    enabledAt also stamped — see the full-scan step above for
          #    rationale (autoDisableStaleCiE2e safety net).
          NOW_ISO=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          aws dynamodb update-item --table-name "$PUBLISHERS_TABLE" \
            --key "{\"id\":{\"S\":\"$PUBLISHER_ID\"}}" \
            --condition-expression 'attribute_exists(id)' \
            --update-expression 'SET enabled = :t, enabledAt = :now' \
            --expression-attribute-values "{\":t\":{\"BOOL\":true},\":now\":{\"S\":\"$NOW_ISO\"}}"

          # 3. Invoke the Lambda with singlePublisherId — synchronous so
          #    we can assert no FunctionError. Payload mirrors what
          #    publisherPortalHandler sends from /publisher-fetch-now,
          #    plus a `source` tag so the CloudWatch log line is
          #    attributable to this CI step. Capture STDOUT metadata
          #    so assert_no_function_error can inspect the
          #    FunctionError key (the CLI does NOT put it in the
          #    payload file).
          INGEST_META=$(aws lambda invoke --function-name "$LAMBDA" \
            --invocation-type RequestResponse \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"singlePublisherId\":\"$PUBLISHER_ID\",\"source\":\"ci-e2e-self-service-test\"}" \
            /tmp/ci-e2e-single-ingest.json)
          echo "[ci-e2e single] ingest metadata: $INGEST_META"
          echo "[ci-e2e single] ingest response:"
          cat /tmp/ci-e2e-single-ingest.json
          echo
          assert_no_function_error /tmp/ci-e2e-single-ingest.json "single-publisher ingest" "$INGEST_META"

          # 4. Poll sidecar for the test events to appear.
          COUNT=0
          for i in $(seq 1 30); do
            RAW=$(count_test_events_in_sidecar)
            COUNT=${RAW:-0}
            if [ "$COUNT" -ge 1 ]; then
              echo "[ci-e2e single] events present after ${i}s (count=$COUNT)"
              break
            fi
            sleep 1
          done
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Single-publisher ingest did not produce events in sidecar within 30s"
            exit 1
          fi

          # 5. Assert the count matches the feed — single-publisher mode
          #    must ingest ALL of that publisher's events, not a subset.
          if [ "$COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "::error::Single-publisher ingest produced $COUNT events but feed has $EXPECTED_COUNT"
            exit 1
          fi

          # 6. Cleanup runs via trap — disables the publisher and fires
          #    a fire-and-forget full ingest to retract these events.

          echo "✅ Publisher single-publisher mode E2E test passed"

      - name: Reinstall dev dependencies for smoke step
        # The earlier "Deploy admin/calendar/sync/publisher-ingest Lambda"
        # steps each run `npm ci --omit=dev` inside ./backend. In a
        # workspaces monorepo that prunes hoisted devDependencies from
        # the top-level node_modules — including jest and ts-jest, which
        # the smoke step (npm run smoke:publisher) needs. Re-run the full
        # install at the repo root to restore them. This is faster than
        # rearranging the deploy steps and keeps each step's contract
        # local: deploy steps assume a pruned tree, the smoke step assumes
        # a full tree.
        run: npm ci

      - name: Post-deploy publisher-lifecycle smoke
        # Runs scripts/smoke/publisher-lifecycle.test.ts against the
        # just-deployed prod stack. Walks bbtest through apply → approve →
        # publish → pause → resume → self-disable → retract end-to-end,
        # exercising real DDB / SES / API Gateway / Lambda / sidecar.
        #
        # If this fails, the deploy job is marked red. Rollback is a
        # separate decision — the deploy itself succeeded; what's red is
        # the post-deploy verification. See
        # docs/runbooks/publisher-smoke-failed.md for triage.
        #
        # Required GitHub repo secrets (set in repo Settings → Secrets and
        # variables → Actions):
        #   - SMOKE_BBTEST_EMAIL
        #   - SMOKE_ADMIN_SIGNING_KEY     (matches Lambda env ADMIN_SMOKE_SIGNING_KEY)
        #   - SMOKE_CAPTCHA_BYPASS_TOKEN  (matches Lambda env CAPTCHA_BYPASS_TOKEN)
        # Until those are populated this step skips loudly (the test
        # describe() returns describe.skip and the job stays green).
        run: npm run smoke:publisher
        env:
          SMOKE_API_BASE: https://www.chqcal.org
          SMOKE_BBTEST_EMAIL: ${{ secrets.SMOKE_BBTEST_EMAIL }}
          SMOKE_ADMIN_SIGNING_KEY: ${{ secrets.SMOKE_ADMIN_SIGNING_KEY }}
          SMOKE_CAPTCHA_BYPASS_TOKEN: ${{ secrets.SMOKE_CAPTCHA_BYPASS_TOKEN }}

      - name: Trigger calendar data sync
        continue-on-error: true
        run: |
          echo "Triggering calendar data sync to refresh cache..."
          # AWS CLI v2 expects base64 payloads by default; --cli-binary-format
          # raw-in-base64-out lets us keep passing the JSON literal.
          aws lambda invoke \
            --function-name chq-calendar-data-sync \
            --invocation-type Event \
            --cli-binary-format raw-in-base64-out \
            --payload '{"source":"chq-calendar.deployment","detail-type":"Weekly Full Sync"}' \
            /tmp/sync-response.json

          echo "Calendar sync triggered successfully - running in background to refresh cache data"

      - name: Trigger article-links ingest
        continue-on-error: true
        run: |
          # Refresh the Chautauquan Daily article links right after deploy
          # instead of waiting up to an hour for the EventBridge schedule.
          # Guarded + continue-on-error so a not-yet-created function (before
          # the first terraform apply) or a transient error never fails deploy.
          FUNC="chautauqua-calendar-article-ingest"
          # Skip only for a genuine not-created-yet; surface any other error
          # (this step is continue-on-error, so a loud failure logs but never
          # fails the deploy).
          if aws lambda get-function --function-name "$FUNC" >/dev/null 2>/tmp/gf-article-trigger.err; then
            :
          elif grep -q 'ResourceNotFoundException\|Function not found' /tmp/gf-article-trigger.err; then
            echo "${FUNC} not created yet — run 'terraform apply' to create it; skipping trigger"
            exit 0
          else
            echo "::error::checking ${FUNC} failed (not a not-found error — likely IAM/API):"
            cat /tmp/gf-article-trigger.err
            exit 1
          fi
          echo "Triggering article-links ingest to refresh news links..."
          # AWS CLI v2 expects base64 payloads by default; --cli-binary-format
          # raw-in-base64-out lets us pass the JSON literal.
          aws lambda invoke \
            --function-name "$FUNC" \
            --invocation-type Event \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            /tmp/article-ingest-response.json
          echo "Article-links ingest triggered - running in background to refresh the sidecar"

      - name: Trigger program-links ingest
        continue-on-error: true
        run: |
          # Refresh the digital program links right after deploy instead of
          # waiting up to an hour for the EventBridge schedule. Guarded +
          # continue-on-error so a not-yet-created function or a transient
          # error never fails deploy.
          FUNC="chautauqua-calendar-program-ingest"
          # Skip only for a genuine not-created-yet; surface any other error
          # (this step is continue-on-error, so a loud failure logs but never
          # fails the deploy).
          if aws lambda get-function --function-name "$FUNC" >/dev/null 2>/tmp/gf-program-trigger.err; then
            :
          elif grep -q 'ResourceNotFoundException\|Function not found' /tmp/gf-program-trigger.err; then
            echo "${FUNC} not created yet — run 'terraform apply' to create it; skipping trigger"
            exit 0
          else
            echo "::error::checking ${FUNC} failed (not a not-found error — likely IAM/API):"
            cat /tmp/gf-program-trigger.err
            exit 1
          fi
          echo "Triggering program-links ingest to refresh links..."
          # AWS CLI v2 expects base64 payloads by default; --cli-binary-format
          # raw-in-base64-out lets us pass the JSON literal.
          aws lambda invoke \
            --function-name "$FUNC" \
            --invocation-type Event \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            /tmp/program-ingest-response.json
          echo "Program-links ingest triggered - running in background to refresh the sidecar"

  # Build + publish the static site. Independent of the Lambda deploys: a
  # frontend-only merge has no reason to redeploy six functions or
  # re-trigger three data ingests.
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: production
    needs: changes
    if: >-
      github.repository == 'bbernstein/chq-calendar'
      && needs.changes.outputs.skip != 'true'
      && needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build frontend
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: ""
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          # Enable fetching/rendering of registered publisher feeds. Sidecar fetch
          # is fault-tolerant: 404/parse errors fall back to primary-only behavior,
          # so this is safe to leave on even before any publisher is onboarded.
          VITE_ENABLE_PUBLISHER_FEEDS: "true"

      - name: Deploy frontend to S3 and CloudFront
        working-directory: ./frontend
        run: |
          BUCKET="${{ secrets.S3_BUCKET_NAME }}"

          # Pass 1 — content-hashed, immutable assets. Exclude the files that must always
          # revalidate so they never get the year-long immutable header. --delete removes
          # stale hashed bundles; excluded files are neither uploaded nor deleted here.
          aws s3 sync out/ "s3://$BUCKET/" \
            --delete \
            --exclude "*.map" \
            --exclude "cache/*" \
            --exclude "*.html" \
            --exclude "manifest.json" \
            --exclude "version.json" \
            --exclude "sw.js" \
            --exclude "data/weekly-themes/*" \
            --cache-control "public, max-age=31536000, immutable"

          # Pass 2 — always-revalidate files. `cp` re-uploads unconditionally (unlike
          # `sync`, which skips unchanged files and was the cause of the stale-shell bug),
          # so the no-cache header is applied every time.
          aws s3 cp out/ "s3://$BUCKET/" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --content-type "text/html" \
            --cache-control "no-cache"

          aws s3 cp out/manifest.json "s3://$BUCKET/manifest.json" \
            --content-type "application/json" \
            --cache-control "no-cache"

          aws s3 cp out/version.json "s3://$BUCKET/version.json" \
            --content-type "application/json" \
            --cache-control "no-cache"

          aws s3 cp out/sw.js "s3://$BUCKET/sw.js" \
            --content-type "text/javascript" \
            --cache-control "no-cache"

          # weekly-themes JSON is fetched directly from /data/ in production
          # (useWeeklyThemes has no dev/prod split) and is NOT content-hashed,
          # so it must revalidate — otherwise a content edit under the same
          # filename would never reach users (the same bug this deploy fixes).
          aws s3 cp out/data/weekly-themes/ "s3://$BUCKET/data/weekly-themes/" \
            --recursive \
            --content-type "application/json" \
            --cache-control "no-cache"

          # Invalidate CloudFront cache
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # Cross-cutting post-deploy smoke. Separate from both deploy jobs because
  # it exercises the API *and* the site, so it belongs to neither and must
  # run whichever one deployed.
  #
  # always() so it still runs when one deploy job was skipped; the explicit
  # result checks below stop it running when a deploy actually FAILED, and
  # stop it running at all when nothing deployed.
  verify:
    runs-on: ubuntu-latest
    needs: [changes, deploy-backend, deploy-frontend]
    if: >-
      always()
      && github.repository == 'bbernstein/chq-calendar'
      && needs.deploy-backend.result != 'failure'
      && needs.deploy-frontend.result != 'failure'
      && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')

    steps:
      - name: Run post-deployment tests
        continue-on-error: true
        run: |
          # Wait for deployment to propagate
          sleep 30

          # Test production API
          echo "Testing production API..."
          echo "URL: https://www.chqcal.org/api/health"
          curl -v "https://www.chqcal.org/api/health" || echo "API health check failed with status $?"

          # Test calendar endpoint
          EVENTS_COUNT=$(curl -s "https://www.chqcal.org/api/calendar?format=json" \
            -H "Accept: application/json" | jq '.events | length' || echo "0")

          if [ "$EVENTS_COUNT" -gt "0" ]; then
            echo "✅ Production API returning $EVENTS_COUNT events"
          else
            echo "❌ Production API not returning events"
            exit 1
          fi

          # Test frontend
          echo "Testing production frontend..."
          curl -f "https://www.chqcal.org" || exit 1

          echo "🎉 Production deployment successful!"

          echo ""
          echo "⚠️  Note: If API tests failed with 403, check:"
          echo "  1. API Gateway configuration for /api/* routes"
          echo "  2. CloudFront behavior rules for API paths"
          echo "  3. Lambda function URL configuration"

      # True by construction: `verify` runs only when a deploy job reported
      # success (see the job `if:` above).
      #
      # There is deliberately no matching "Notify deployment failure" step.
      # The only step ahead of this one is `continue-on-error: true`, so
      # `failure()` is unreachable inside this job — a step claiming to
      # report failures that never fires is worse than no step at all.
      - name: Notify deployment success
        if: success()
        run: |
          echo "::notice title=Deployment Successful::Production deployment completed successfully at $(date)"
