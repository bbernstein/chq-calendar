name: App Store Assets

# Guards the standing rule in CLAUDE.md: a PR that changes what the iOS app
# looks like must also regenerate the App Store screenshots. Runs on Linux
# because it is pure git-diff analysis — no Xcode involved.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: app-store-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check screenshots were refreshed for UI changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Diff against the merge-base, NOT github.event.pull_request.base.sha
          # directly. base.sha is main's tip *at event time*, which keeps
          # moving as other PRs merge. If another iOS PR merges to main
          # (touching Features/ and regenerating the manifest) while this PR
          # is still open, a diff against the live base tip would show the
          # manifest as "changed" between base and head — even though this
          # branch's own commits never touched it — and the guard would
          # falsely PASS a PR with genuinely stale screenshots. Diffing
          # against the merge-base isolates exactly this PR's own commits,
          # regardless of what has landed on main since the branch point.
          # Do not "simplify" this back to base.sha — that reintroduces the
          # false-pass.
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || {
            echo "ERROR: could not compute a merge-base between $BASE_SHA and $HEAD_SHA." >&2
            echo "Refusing to fall back to a base-tip diff, since that is exactly the comparison this guard must not trust. Check that fetch-depth: 0 is in effect and that both SHAs are reachable." >&2
            exit 1
          }

          changed=$(git diff --name-only "$merge_base" "$HEAD_SHA")

          ui_changed=$(echo "$changed" | grep -E \
            '^ios/ChqCalendar/(Features|App)/|^ios/ChqCalendar/Assets\.xcassets/|^ios/ChqCalendarWidgets/' || true)

          if [ -z "$ui_changed" ]; then
            echo "No UI-affecting iOS changes. Nothing to check."
            exit 0
          fi

          echo "UI-affecting changes detected:"
          echo "$ui_changed" | sed 's/^/  /'

          # Flatten to a single line before matching the opt-out: a PR body
          # is arbitrary Markdown and may hard-wrap or soft-wrap inside the
          # brackets. Multi-line grep is line-based, so an opt-out split
          # across a literal newline would silently fail to match with the
          # PR_BODY as-is. Flattening keeps the failure mode safe either
          # way (worst case: the guard stays strict and asks for a
          # one-line opt-out).
          pr_body_flat=$(printf '%s' "$PR_BODY" | tr '\n' ' ')

          # Requires at least one non-whitespace character inside the
          # brackets, so `[skip-screenshots:]` and `[skip-screenshots:   ]`
          # do NOT satisfy the opt-out (a recorded reason is mandatory).
          if echo "$pr_body_flat" | grep -qE '\[skip-screenshots:[^]]*[^][:space:]][^]]*\]'; then
            reason=$(echo "$pr_body_flat" | grep -oE '\[skip-screenshots:[^]]*[^][:space:]][^]]*\]' | head -1)
            echo "Opt-out present: $reason"
            exit 0
          fi

          # NOTE on trust boundary: this only proves the manifest FILE
          # differs between merge-base and head — it is a content-fingerprint
          # check, not proof the change came from an honest
          # compose-screenshots.py run rather than a hand-edit of the JSON.
          # That is inherent to any git-diff-based guard; a determined
          # author can always fake it. The value here is raising the floor
          # for the honest-mistake case (forgetting to regenerate), not
          # cryptographic attestation.
          if echo "$changed" | grep -qx 'docs/app-store/screenshots.manifest.json'; then
            echo "Screenshot manifest was regenerated."
            exit 0
          fi

          cat >&2 <<'MSG'

          ERROR: This PR changes the iOS app's UI but does not refresh the
          App Store screenshots.

          Per the "App Store listing upkeep (iOS)" rule in CLAUDE.md:

            1. Regenerate:
                 ios/Scripts/capture-screenshots.sh
                 python3 ios/Scripts/compose-screenshots.py
            2. Re-read docs/app-store/listing-copy.md for claims this
               change invalidates.
            3. Commit the updated docs/app-store/screenshots.manifest.json
               and docs/app-store/screenshots/review/ copies.

          If this change genuinely does not alter any pixel a user sees,
          add an opt-out line to the PR description:

            [skip-screenshots: pure refactor, no visual change]

          If you regenerated and the manifest did not change because the
          shot list does not cover the screen you touched, that is also a
          valid opt-out:

            [skip-screenshots: regenerated, no covered shot changed]

          MSG
          exit 1
