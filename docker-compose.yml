version: "3.8"

services:
  # DynamoDB Local
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: chq-calendar-dynamodb
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - chq-calendar-network

  # Backend (Express server for local development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: chq-calendar-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=dev
      - PORT=3001
      - AWS_REGION=us-east-1
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      # Load from .env file (you'll need to create this)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL_WHITELIST=${ADMIN_EMAIL_WHITELIST}
      - EVENTS_TABLE_NAME=chautauqua-calendar-events
      - DATA_SOURCES_TABLE_NAME=chautauqua-calendar-data-sources  
      - FEEDBACK_TABLE_NAME=chautauqua-calendar-feedback
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - dynamodb
    networks:
      - chq-calendar-network
    command: npm run dev

  # Frontend (Vite + Preact)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: chq-calendar-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Points browser directly to backend (Docker proxy can't reach localhost:3001)
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - dynamodb
    networks:
      - chq-calendar-network
    command: npx vite --host

  # LocalStack — S3-compatible endpoint for local integration testing of the
  # article-links pipeline (EventSnapshotLoader / ArticleLinksPublisher run the
  # real AWS SDK against this instead of production S3). See
  # backend/src/scripts/runArticleIngestLocalAws.ts and
  # docs/runbooks/article-links.md.
  localstack:
    image: localstack/localstack:latest
    container_name: chq-calendar-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=0
    networks:
      - chq-calendar-network

  # DynamoDB Admin UI (optional)
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: chq-calendar-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
    depends_on:
      - dynamodb
    networks:
      - chq-calendar-network

volumes:
  dynamodb_data:

networks:
  chq-calendar-network:
    driver: bridge
