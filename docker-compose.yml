version: "3.8"

services:
  # DynamoDB Local
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: chq-calendar-dynamodb
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - chq-calendar-network

  # Note: Backend now runs as Lambda functions in AWS
  # For local development, use Lambda simulators or deploy to AWS for testing

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: chq-calendar-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # In development, admin features will require deploying Lambda functions to AWS
      - NEXT_PUBLIC_API_URL=https://chqcal.org
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - dynamodb
    networks:
      - chq-calendar-network
    command: npm run dev

  # DynamoDB Admin UI (optional)
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: chq-calendar-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
    depends_on:
      - dynamodb
    networks:
      - chq-calendar-network

volumes:
  dynamodb_data:

networks:
  chq-calendar-network:
    driver: bridge
